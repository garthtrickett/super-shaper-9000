[package]
name = "surfer-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]


[dependencies.log]
version = "0.4"

[dependencies.console_log]
version = "1.0"


[dependencies]
surfer-core = { path = "../surfer-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
tsify = { version = "0.4", features = ["js"] }
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.85"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "Window", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1.7"
rayon = "1.10"
wasm-bindgen-rayon = "1.3.0"
wgpu = { version = "0.20", features = ["webgl"] }
wasm-bindgen-futures = "0.4"

