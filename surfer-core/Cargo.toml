[package]
name = "surfer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Enable the `derive` feature for serde to use #[derive(Serialize, Deserialize)]
serde = { version = "1.0", features = ["derive"] }

# Enable the `serialize` feature for quick-xml to use the `de` (deserialization) module
quick-xml = { version = "0.31.0", features = ["serialize"] }

glam = "0.27.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
ctor = "0.2"
