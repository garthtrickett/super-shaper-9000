[package]
name = "surfer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
md-5 = "0.10"
des = "0.8"
cbc = "0.1"
flate2 = "1.0"
# Enable the `derive` feature for serde to use #[derive(Serialize, Deserialize)]
serde = { version = "1.0", features = ["derive"] }

# Enable the `serialize` feature for quick-xml to use the `de` (deserialization) module
quick-xml = { version = "0.31.0", features = ["serialize"] }

glam = "0.27.0"
log = "0.4"
approx = "0.5"



[dev-dependencies]
approx = "0.5"
env_logger = "0.11"
ctor = "0.2"

