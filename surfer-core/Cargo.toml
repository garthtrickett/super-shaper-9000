[package]
name = "surfer-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.27", features = ["serde"] }

[dependencies.log]
version = "0.4"

[dev-dependencies]
ctor = "1.0.3"
env_logger = "0.11.10"

[dependencies.quick-xml]
version = "0.31"
features = ["serialize"]

